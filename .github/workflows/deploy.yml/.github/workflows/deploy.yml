name: 部署博客到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🗂 整理目录结构
        run: |
          # 1. README.md → docs/
          [ -f "README.md" ] && [ ! -f "docs/README.md" ] && mkdir -p docs && mv README.md docs/README.md || true
          # 2. md 内容目录
          for dir in about friend-links posts; do
            [ -d "$dir" ] && [ ! -d "docs/$dir" ] && mv "$dir" "docs/$dir" || true
          done
          # 3. .vuepress 配置文件
          mkdir -p docs/.vuepress
          for f in config.ts plume.config.ts client.ts; do
            [ -f "$f" ] && [ ! -f "docs/.vuepress/$f" ] && mv "$f" "docs/.vuepress/$f" || true
          done
          # 4. styles 目录（关键：先移再创建其他目录！）
          if [ -d "styles" ] && [ ! -f "docs/.vuepress/styles/hero.css" ]; then
            rm -rf docs/.vuepress/styles 2>/dev/null
            mv styles docs/.vuepress/styles
          fi
          # 5. 确保 public 目录存在
          mkdir -p docs/.vuepress/public
          # 6. 打印整理后结构
          echo "=== 整理后 ===" && find . -not -path './.git/*' -maxdepth 4 | sort

      - name: ⚙️ pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 🟢 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 📦 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 构建
        env:
          BASE: /
          SITE_HOSTNAME: https://hbxdss.github.io
        run: pnpm run docs:build

      - name: 📄 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: 🚀 部署
        id: deployment
        uses: actions/deploy-pages@v4
